# Dependabot — pembaruan dependency terjadwal.
# Dipasang 28 Sep 2026 setelah npm audit menemukan 10 celah di app.
# Supaya tidak membanjiri PR: seminggu sekali (Senin pagi WIB), minor+patch
# digabung jadi SATU PR, versi mayor diabaikan (dinaikkan manual & diuji).
# Tambalan KEAMANAN tetap datang kapan saja lewat "Dependabot security updates"
# (diaktifkan di pengaturan repo), terpisah dari jadwal ini.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      minor-dan-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
